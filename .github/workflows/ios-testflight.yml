# Fabrica la app de iPhone en un Mac de GitHub, la firma con la cuenta de Apple de Rodrigo
# y la sube a TestFlight. Se lanza sola al subir cambios de la app a la rama beta, o a mano
# desde la pestaña Actions ("Run workflow"). Las claves viven en Settings → Secrets, cifradas.
name: iPhone · TestFlight

on:
  workflow_dispatch:
  push:
    branches: [beta]
    paths:
      - "src/**"
      - "ios/**"
      - "index.html"
      - "boot.js"
      - "styles.css"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/ios-testflight.yml"

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar que las claves de Apple están puestas
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secreto de $v en Settings → Secrets and variables → Actions"; exit 1; fi
          done
          if [ -z "${{ secrets.APPSTORE_PRIVATE_KEY }}" ]; then echo "::error::Falta el secreto APPSTORE_PRIVATE_KEY"; exit 1; fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar y pasar las pruebas
        run: |
          npm ci
          npm test

      - name: Compilar la web y copiarla dentro del proyecto de iPhone
        run: |
          npm run build
          npm run www
          npx cap sync ios

      - name: Elegir Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Preparar la clave de App Store Connect
        env:
          ASC_P8: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          # la clave se reconstruye en formato PEM aunque se haya pegado sin saltos de línea o con espacios
          printf '%s' "$ASC_P8" | tr -d '\r' > "$RUNNER_TEMP/asc/raw.txt"
          cuerpo=$(sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' "$RUNNER_TEMP/asc/raw.txt" | tr -d ' \n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; echo "$cuerpo" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          rm -f "$RUNNER_TEMP/asc/raw.txt"
          # diagnóstico sin revelar nada: tamaño del cuerpo y si es una clave EC válida
          echo "Clave: ${#cuerpo} caracteres de cuerpo (una clave de Apple suele tener unos 200)"
          if ! openssl pkey -in "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" -noout 2>/dev/null; then
            grep -q "BEGIN PRIVATE KEY" <<<"$ASC_P8" || echo "::error::El secreto APPSTORE_PRIVATE_KEY no contiene la línea -----BEGIN PRIVATE KEY-----"
            echo "::error::El secreto APPSTORE_PRIVATE_KEY no es una clave privada válida: vuelve a pegar el contenido entero del archivo AuthKey_${ASC_KEY_ID}.p8"
            exit 1
          fi
          echo "Clave privada válida."
          sed "s/__TEAM_ID__/${TEAM_ID}/" ios/ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

      - name: Fabricar (archive)
        run: |
          set +e
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            > "$RUNNER_TEMP/archive.log" 2>&1
          rc=$?
          grep -E "error:|\*\* ARCHIVE" "$RUNNER_TEMP/archive.log" | tail -n 20
          if [ $rc -ne 0 ]; then
            grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -n 15 | sed 's/^/::error::/'
            tail -n 25 "$RUNNER_TEMP/archive.log" | sed 's/^/::warning::/'
            exit 1
          fi

      - name: Firmar y subir a TestFlight
        run: |
          set +e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1
          rc=$?
          tail -n 30 "$RUNNER_TEMP/export.log"
          if [ $rc -ne 0 ]; then
            grep -iE "error" "$RUNNER_TEMP/export.log" | sort -u | head -n 15 | sed 's/^/::error::/'
            exit 1
          fi
          echo "Subida la compilación ${{ github.run_number }}. Apple tarda unos minutos en procesarla antes de que aparezca en TestFlight."

      - name: Borrar la clave del Mac
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
